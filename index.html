<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0C" />

    <!-- PWA: маніфест + іконки (файли лежать у public/). Відносні шляхи —
         vite сам підставить правильний base (web: /web/, Tauri: ./) -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />

    <!-- noindex: це РОБОЧИЙ ІНТЕРФЕЙС застосунку, а не сторінка для пошуку.
         Без цього Google індексує /web і показує в результатах застарілий,
         часто зламаний опис (стара версія, тексти яких уже нема), тягнучи
         вниз враження від справжнього лендинга на morok.app.
         Лендинг (окремий сайт) індексується нормально — там noindex немає. -->
    <meta name="robots" content="noindex, nofollow">
    <title>Morok — приватний месенджер без телефону</title>
    <meta name="description" content="Месенджер який нічого про вас не зберігає. Без телефону, без email, без імені." />

    <!-- Favicon: inline SVG (no separate file needed). Renders as a violet "M". -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%236B8AFE%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-family%3D%22Arial%2C%20sans-serif%22%20font-size%3D%2236%22%20font-weight%3D%22700%22%20text-anchor%3D%22middle%22%20fill%3D%22white%22%3EM%3C%2Ftext%3E%3C%2Fsvg%3E" />

    <!-- Open Graph (Telegram, Discord, iMessage, Slack, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Morok" />
    <meta property="og:title" content="Morok — приватний месенджер без телефону" />
    <meta property="og:description" content="Месенджер який нічого про вас не зберігає. Без телефону, без email, без імені." />
    <meta property="og:image" content="https://morok.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://morok.app" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Morok — приватний месенджер без телефону" />
    <meta name="twitter:description" content="Месенджер який нічого про вас не зберігає. Без телефону, без email, без імені." />
    <meta name="twitter:image" content="https://morok.app/og.png" />

    <!-- ПРИВАТНІСТЬ: жодних зовнішніх запитів.
         Раніше тут вантажились Google Fonts — тобто застосунок на КОЖНОМУ
         запуску повідомляв Google IP і User-Agent користувача. Для
         privacy-месенджера це неприйнятно, а в Windows/Android-збірках ще й
         означало «дзвінок додому» та зламані шрифти без інтернету.
         Тепер використовуються системні шрифти (fallback уже прописаний
         у global.css). Якщо схочете повернути Manrope — покладіть .woff2
         локально і підключіть @font-face, БЕЗ звернень до Google. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
